<!doctype html><html lang="ko"><meta charset="utf-8"><title>우사기 춤 재제작 검수</title>
<style>body{font:16px system-ui;background:#fff8eb;color:#59443b;margin:32px;line-height:1.6}main{display:flex;flex-wrap:wrap;gap:24px}img{max-width:100%;height:auto}figure{margin:0}button{padding:8px;margin:8px}canvas{display:block;background:repeating-conic-gradient(#d9e8ed 0% 25%,#fff 0% 50%) 0/24px 24px}</style>
<h1>우사기 엉덩이 흔들기 · 영상 기반 재제작</h1><p>뒤태 엉덩이 비틀기 → 오른쪽 옆얼굴 바운스. 6프레임 / 5fps / 1.2초 루프. 귀 뒷면은 연노랑, 꼬리는 흰 솜털.</p>
<main><figure><canvas id="preview" width="256" height="256"></canvas><button id="play">재생 / 정지</button><button id="step">다음 프레임</button><p id="status"></p></figure><figure><img src="preview.gif" width="256" height="256"><figcaption>크림 배경 GIF · 200ms/프레임</figcaption></figure></main>
<h2>수정 시트</h2><img src="review.png" width="768" height="512">
<h2>원본 영상의 키포즈</h2><img src="reference/six_keyposes.png" width="930" height="848">
<script>const cv=document.getElementById('preview'),ctx=cv.getContext('2d'),im=new Image();let frame=0,running=true,last=0;function draw(){ctx.clearRect(0,0,256,256);ctx.drawImage(im,frame%3*256,Math.floor(frame/3)*256,256,256,0,0,256,256);document.getElementById('status').textContent=`프레임 ${frame+1}/6 · 200ms`}im.onload=()=>{draw();requestAnimationFrame(tick)};im.src='../../../godot/assets/effects/spritesheets/usagi_shake.png';function tick(now){if(!last)last=now;if(running&&now-last>=200){frame=(frame+1)%6;last=now;draw()}requestAnimationFrame(tick)}document.getElementById('play').onclick=()=>{running=!running;last=performance.now()};document.getElementById('step').onclick=()=>{running=false;frame=(frame+1)%6;draw()};</script></html>
